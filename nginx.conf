worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend {
        server backend:5000;
    }

    upstream transactions {
        server transactions:3000;
    }

    upstream frontend {
        server studentportfolio:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Exact /api/transactions goes to the Flask backend: it returns the
        # logged-in user's transactions grouped by month, and the dashboard
        # "View Transactions" button fetches this exact URL.
        location = /api/transactions {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Transactions microservice (JavaScript): /api/transactions/<userId>
        # returns that user's transactions grouped by month and year.
        # This regex must come before the general /api/ block below,
        # because Nginx uses the first matching regex location.
        location ~ ^/api/transactions/ {
            proxy_pass http://transactions;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other API calls go to the backend first, so they never
        # fall through to the UI.
        location ~ ^/(api|deposit|withdraw|login|register|dashboard|logout) {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else goes to the frontend (student portfolio).
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
